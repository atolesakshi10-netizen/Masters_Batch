<!DOCTYPE html>
<html>
<head>
    <title>Class Attribute Example</title>
    <style>
        .format {
            font-family: cursive;
            font-size: 200%;
            color: brown;
        }
        .background-clr {
            background-color: cadetblue;
        }
    </style>
</head>
<body>
    <!-- Applying class "format" -->
    <p class="format">This text uses the 'format' class.</p>

    <!-- Applying multiple classes -->
    <p class="format background-clr">
        This text uses both 'format' and 'background-clr' classes.
    </p>

    <!-- Another element with same class -->
    <div class="background-clr">
        This div has a cadetblue background.
    </div>
</body>
</html>
